name: bot

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes at busy times
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Discover, verify, sync catalogs, build site data
        run: python -m bot all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - name: Commit data
        id: commit
        run: |
          git config user.name "shop-lebanese-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data seeds/blocklist.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "bot: $(date -u +%Y-%m-%dT%H:%MZ) data update"
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: run
    if: needs.run.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
